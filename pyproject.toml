[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-local-ai"
version = "0.1.0.dev0"
description = "Offline-first interfaces for local language and accessibility tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["translation", "offline", "amharic", "oromo", "tigrinya", "low-resource", "accessibility"]
authors = [{ name = "Anwar Mohammed" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
argos = [
    "argostranslate>=1.11,<2",
]
nllb = [
    "ctranslate2>=4,<5",
    "sentencepiece>=0.2,<1",
]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
[tool.setuptools.package-data]
open_local_ai = ["py.typed"]

[project.urls]
Homepage = "https://github.com/unmoha/open-local-ai"
Repository = "https://github.com/unmoha/open-local-ai"
Issues = "https://github.com/unmoha/open-local-ai/issues"
Changelog = "https://github.com/unmoha/open-local-ai/blob/main/CHANGELOG.md"

[project.scripts]
open-local-ai = "open_local_ai.cli:main"
